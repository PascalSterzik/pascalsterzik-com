<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a call | Pascal Sterzik</title>
<meta name="description" content="Answer a few quick questions and book a call with Pascal Sterzik.">
<link rel="canonical" href="https://pascalsterzik.com/book">
<link rel="icon" href="/favicon.svg?v=12" type="image/svg+xml">
<link rel="icon" href="/favicon-64.png?v=12" type="image/png" sizes="64x64">
<link rel="icon" href="/favicon.ico?v=12" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=12">
<link rel="stylesheet" href="/fonts/fonts.css?v=8">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="page-dark book-page">
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Pascal Sterzik, home"><img class="logo-full" src="/brand/logo-dark.svg?v=12" width="157" height="32" alt="Pascal Sterzik"><img class="logo-sym" src="/brand/symbol-dark.svg?v=12" width="24" height="32" alt=""></a>
  </div>
</header>

<main id="main" class="book">
  <div class="wrap book-wrap">
    <ol class="dots" id="dots" aria-hidden="true"></ol>
    <p class="sr-only" id="progress" aria-live="polite"></p>
    <form id="book-form" novalidate>
      <div class="hp" aria-hidden="true"><label>Leave this empty <input type="text" name="website_url" tabindex="-1" autocomplete="off"></label></div>
      <div class="stage" id="stage"></div>
      <p class="form-error" id="form-error" role="alert" hidden></p>
      <div class="book-nav" id="book-nav" hidden>
        <button type="button" class="back" id="back">Back</button>
        <button type="submit" class="btn btn-primary" id="next">Continue</button>
      </div>
    </form>
  </div>
</main>
<script src="/book.js"></script>
</body>
</html>
