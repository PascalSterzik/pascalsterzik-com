<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio | Pascal Sterzik</title>
<meta name="description" content="Static ads and video ads for DTC brands, with the full copy for each.">
<link rel="canonical" href="https://pascalsterzik.com/portfolio">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="page-dark">
<a class="skip-link" href="#lib">Skip to ads</a>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Pascal Sterzik, home"><img src="/brand/mark-dark.svg" width="36" height="36" alt=""><span>Pascal Sterzik</span></a>
    <nav class="nav" aria-label="Main">
      <a class="nav-link" href="/portfolio" aria-current="page">Portfolio</a>
      <a class="btn btn-primary" href="/book">Book a call</a>
    </nav>
  </div>
</header>

<main id="main">
  <section class="lib-top texture">
    <div class="wrap">
      <h1>Portfolio</h1>
    </div>
  </section>

  <div class="toolbar">
    <div class="wrap">
      <div class="row">
        <div class="tabs" id="tabs" role="tablist" aria-label="Ad format"></div>
        <div class="tabs" id="langs" role="tablist" aria-label="Language"></div>
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search ads or brands" aria-label="Search ads or brands" autocomplete="off">
        </div>
        <label class="sort">Sort
          <select id="sort"><option value="featured">Featured</option><option value="newest">Newest</option><option value="brand">Brand</option></select>
        </label>
      </div>
      <div class="row" id="chips"></div>
    </div>
  </div>

  <section class="lib" aria-label="All ads">
    <div class="wrap">
      <div class="masonry" id="lib"></div>
      <p class="empty" id="empty" hidden>No ads match these filters. <button class="clear">Clear all</button></p>
    </div>
  </section>
  <section class="lib-cta texture" aria-labelledby="cta-h">
    <div class="wrap">
      <h2 id="cta-h">Like what you see?</h2>
      <p>Answer a few quick questions and book a call.</p>
      <a class="btn btn-primary btn-big" href="/book">Book a call</a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <a class="foot-logo" href="/" aria-label="Pascal Sterzik, home"><img src="/brand/mark-dark.svg" width="28" height="28" alt=""><span>© 2026 Pascal Sterzik</span></a>
    <div class="social">
      <a href="https://www.linkedin.com/in/pascalsterzik" target="_blank" rel="noopener" aria-label="Pascal Sterzik on LinkedIn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a>
      <a href="https://x.com/PascalSterzik" target="_blank" rel="noopener" aria-label="Pascal Sterzik on X"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg></a>
    </div>
    <nav aria-label="Legal"><a href="/impressum">Impressum</a><a href="/datenschutz">Datenschutz</a></nav>
  </div>
</footer>

<div class="modal" id="ad-modal" hidden role="dialog" aria-modal="true" aria-labelledby="ad-title">
  <div class="scrim"></div>
  <div class="panel">
    <div class="bar">
      <button class="icon-btn" data-prev aria-label="Previous ad"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <span class="pos"></span>
      <button class="icon-btn" data-next aria-label="Next ad"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="icon-btn copy-btn" data-copy><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span>Copy link</span></button>
      <button class="icon-btn" data-close aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="post"></div>
    <div class="details"><div class="details-body"></div></div>
  </div>
</div>

<script src="/ads.js"></script>
<script src="/app.js"></script>
</body>
</html>
