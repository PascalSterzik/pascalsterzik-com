<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio | Pascal Sterzik</title>
<meta name="description" content="Static ads and video ads for DTC brands, with the full copy for each.">
<link rel="canonical" href="https://pascalsterzik.com/portfolio">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A1C36'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='700' font-size='34' text-anchor='middle' fill='%23F2A43A'%3EPS%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="page-dark">
<a class="skip-link" href="#lib">Skip to ads</a>

<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="/">Pascal Sterzik<span>.</span></a>
    <nav class="nav" aria-label="Main">
      <a class="nav-link" href="/portfolio" aria-current="page">Portfolio</a>
      <a class="btn btn-primary" href="mailto:pascal@pascalsterzik.com" aria-label="Email me"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span class="label">Email me</span></a>
    </nav>
  </div>
</header>

<main id="main">
  <section class="lib-top texture">
    <div class="wrap">
      <h1>Portfolio</h1>
    </div>
  </section>

  <div class="toolbar">
    <div class="wrap">
      <div class="row">
        <div class="tabs" id="tabs" role="tablist" aria-label="Ad format"></div>
        <div class="tabs" id="langs" role="tablist" aria-label="Language"></div>
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search ads or brands" aria-label="Search ads or brands" autocomplete="off">
        </div>
        <label class="sort">Sort
          <select id="sort"><option value="featured">Featured</option><option value="newest">Newest</option><option value="brand">Brand</option></select>
        </label>
      </div>
      <div class="row" id="chips"></div>
    </div>
  </div>

  <section class="lib" aria-label="All ads">
    <div class="wrap">
      <div class="masonry" id="lib"></div>
      <p class="empty" id="empty" hidden>No ads match these filters. <button class="clear">Clear all</button></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© 2026 Pascal Sterzik</span>
    <nav aria-label="Legal"><a href="/impressum">Impressum</a><a href="/datenschutz">Datenschutz</a></nav>
  </div>
</footer>

<div class="modal" id="ad-modal" hidden role="dialog" aria-modal="true" aria-labelledby="ad-title">
  <div class="scrim"></div>
  <div class="panel">
    <div class="bar">
      <button class="icon-btn" data-prev aria-label="Previous ad"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <span class="pos"></span>
      <button class="icon-btn" data-next aria-label="Next ad"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="icon-btn copy-btn" data-copy><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span>Copy link</span></button>
      <button class="icon-btn" data-close aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="post"></div>
    <div class="details"><div class="details-body"></div></div>
  </div>
</div>

<script src="/ads.js"></script>
<script src="/app.js"></script>
</body>
</html>
